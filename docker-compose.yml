services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cheops-ai:latest
    container_name: cheops-api
    command: ["python", "-m", "uvicorn", "apris.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "Agg"
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns
      - ./.run:/app/.run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ui:
    image: cheops-ai:latest
    container_name: cheops-ui
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "streamlit",
        "run",
        "app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--server.headless",
        "true",
      ]
    environment:
      CHEOPS_API_BASE_URL: "http://api:8000"
      CHEOPS_API_TIMEOUT: "20"
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "Agg"
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns
      - ./.run:/app/.run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    restart: unless-stopped
